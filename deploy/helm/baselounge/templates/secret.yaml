{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baselounge.secretName" . }}
  labels:
    {{- include "baselounge.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOT_TOKEN: {{ required "Задайте existingSecret или secrets.BOT_TOKEN" .Values.secrets.BOT_TOKEN | quote }}
  DATABASE_URL: {{ required "Задайте existingSecret или secrets.DATABASE_URL" .Values.secrets.DATABASE_URL | quote }}
{{- end }}
